[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragx"
version = "0.1.0"
description = "RAGX - self-healing retrieval-augmented generation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.60",
    "numpy>=1.26",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
ragx = "ragx.cli:app"

[tool.setuptools.packages.find]
include = ["ragx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
